<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank you | CRD Berlin</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#111111">
    <link rel="icon" href="assets/images/favicon.ico" sizes="48x48">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
</head>

<body class="legal-page">

<header class="header scrolled">
    <div class="container header-container">
        <a href="index.html" class="logo" aria-label="CRD Berlin – home">
            <img src="assets/images/logo-dark.webp" alt="CRD Berlin" width="396" height="160">
        </a>
    </div>
</header>

<main class="thank-you">
    <div class="container">
        <h1 id="ty-title">Thank you for your message.</h1>
        <p id="ty-text">We have received your enquiry and will get back to you shortly. For urgent matters, call or message us on +49 1575 661 4358.</p>
        <a href="index.html" class="btn btn-primary" id="ty-back">Back to website</a>
    </div>
</main>

<script>
    (function () {
        var t = {
            de: ["Vielen Dank für Ihre Nachricht.", "Wir haben Ihre Anfrage erhalten und melden uns in Kürze. In dringenden Fällen erreichen Sie uns telefonisch oder per WhatsApp unter +49 1575 661 4358.", "Zurück zur Website"],
            es: ["Gracias por su mensaje.", "Hemos recibido su consulta y le responderemos en breve. Para asuntos urgentes, llámenos o escríbanos por WhatsApp al +49 1575 661 4358.", "Volver a la web"]
        };
        var l = null;
        try { l = localStorage.getItem("crd-lang"); } catch (e) {}
        l = l || (navigator.language || "en").slice(0, 2);
        if (!t[l]) { return; }
        document.documentElement.lang = l;
        document.title = t[l][0] + " | CRD Berlin";
        document.getElementById("ty-title").textContent = t[l][0];
        document.getElementById("ty-text").textContent = t[l][1];
        document.getElementById("ty-back").textContent = t[l][2];
    })();
</script>

</body>

</html>
